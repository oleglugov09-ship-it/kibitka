# Serves the browser build. The big files also sit alongside compressed (.gz, made by the Dockerfile):
# 88 MB shrink to about a quarter, so it loads faster and uses less traffic.
server {
  listen 8080;
  root /site;
  index index.html;
  gzip_static on;
  gzip_proxied any;      # requests come through the Fly proxy — without this the compressed files are not served
  types {
    text/html html;
    application/javascript js;
    application/wasm wasm;
    application/octet-stream pck;
    image/png png;
    image/gif gif;
  }
  location / {
    add_header Cache-Control "no-cache";   # a new build is picked up right away, with no "clear your cache"
    try_files $uri $uri/ =404;
  }
}
