[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="terrain/*.bin,terrain/mats/*.txt,models/*.glb,textures/*,mods/*"
exclude_filter="textures/*.png,addons/terrain_3d/brushes/*,addons/terrain_3d/extras/*,addons/terrain_3d/icons/*,addons/terrain_3d/menu/*,addons/terrain_3d/src/*,addons/terrain_3d/tools/*,addons/terrain_3d/utils/*,terrain/terrain.tscn,terrain/assets.res,terrain/material.res"
export_path="../export/web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>(function(){var raf=window.requestAnimationFrame.bind(window),q=new Map(),n=1;try{var w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},50)'])));w.onmessage=function(){if(!document.hidden||!q.size)return;var c=Array.from(q.values());q.clear();var t=performance.now();for(var i=0;i<c.length;i++){try{c[i](t)}catch(e){console.error(e)}}};window.requestAnimationFrame=function(cb){var h=n++;q.set(h,cb);raf(function(t){if(q.delete(h))cb(t)});return h};window.cancelAnimationFrame=function(h){q.delete(h)};}catch(e){}})();</script><script>window.addEventListener('DOMContentLoaded',function(){var p=document.getElementById('status-progress'),s=document.getElementById('status');if(!p||!s)return;var t=document.createElement('div');t.style.cssText='position:fixed;left:0;right:0;bottom:9%;z-index:99;text-align:center;color:#e8e0d0;font:15px sans-serif;text-shadow:0 1px 3px #000;pointer-events:none';document.body.appendChild(t);var ru=(navigator.language||'').slice(0,2)==='ru',t0=Date.now(),full=0,gone=0,last=Date.now();var iv=setInterval(function(){var now=Date.now(),sec=Math.round((now-t0)/1000),gap=now-last;last=now;if(!document.body.contains(s)){if(gap>900||(gone&&now-gone>4000)){t.remove();clearInterval(iv);return}if(!gone){gone=now;t.textContent=(ru?'Строится мир. Ещё несколько секунд':'Building the world. A few more seconds')}return}var v=p.value,m=p.max;if(p.hasAttribute('value')&&m>1&&v<m*0.995){t.textContent=(ru?'Загружается игра: ':'Loading the game: ')+Math.round(100*v/m)+' %'}else{if(m>1){full=1}if(full){p.removeAttribute('value')}t.textContent=full?(ru?'Догружается и запускается. Ещё немного, это не зависло ('+sec+' с)':'Finishing the download and starting. A little longer, it has not hung ('+sec+' s)'):(ru?'Загружается игра…':'Loading the game…')}},400)});</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
