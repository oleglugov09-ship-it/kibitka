[preset.0]

name="Web"
platform="Web"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="textures/*,sounds/*.wav,discs/*.wav,discs/*.mp3,mods/*"
exclude_filter=""
export_path="../export/web/index.html"

[preset.0.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>(function(){var raf=window.requestAnimationFrame.bind(window),q=new Map(),n=1;try{var w=new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},50)'])));w.onmessage=function(){if(!document.hidden||!q.size)return;var c=Array.from(q.values());q.clear();var t=performance.now();for(var i=0;i<c.length;i++){try{c[i](t)}catch(e){console.error(e)}}};window.requestAnimationFrame=function(cb){var h=n++;q.set(h,cb);raf(function(t){if(q.delete(h))cb(t)});return h};window.cancelAnimationFrame=function(h){q.delete(h)};}catch(e){}})();</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
